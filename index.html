<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫寝うにのあわんてんぼうクリスマス</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('./bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* 幻想的なオープニング・スプラッシュスクリーン */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 1.2s ease, visibility 1.2s ease;
      cursor: pointer;
      padding: 20px;
      text-align: center;
    }
    #intro-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .intro-title {
      color: #fff;
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 64, 129, 0.6);
      letter-spacing: 0.05em;
    }
    .intro-subtitle {
      color: #fce4ec;
      font-size: 0.85rem;
      margin-bottom: 30px;
      opacity: 0.9;
      animation: pulse-glow 2s infinite ease-in-out;
    }
    .intro-btn {
      background: linear-gradient(135deg, #ff4081, #d32f2f, #ffd700);
      background-size: 200% 200%;
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 0 25px rgba(255, 64, 129, 0.6);
      animation: gradient-anim 4s ease infinite;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .intro-btn:active {
      transform: scale(0.95);
    }

    @keyframes gradient-anim {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    /* 雪のエフェクト */
    .snowflake {
      position: absolute;
      top: -10px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: fall linear infinite;
      box-shadow: 0 0 8px #fff;
    }
