<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫寝うにのあわてんぼうクリスマスイベント</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('./bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 15px 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid #d4af37;
      border-radius: 16px;
      max-width: 450px;
      width: 100%;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      margin-top: 10px;
    }
    h1 {
      color: #c62828;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 12px;
      border-bottom: 2px dashed #d4af37;
      padding-bottom: 6px;
    }
    .description {
      background: rgba(255, 255, 255, 0.75);
      border-left: 4px solid #c62828;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .description h2 {
      font-size: 0.95rem;
      color: #1b5e20;
      margin-bottom: 6px;
    }
    .info-list {
      list-style: none;
      line-height: 1.5;
      font-size: 0.85rem;
    }
    .info-list li span {
      font-weight: bold;
      color: #b71c1c;
    }
    .badge {
      display: inline-block;
      background: #2e7d32;
      color: #fff;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .note {
      font-size: 0.75rem;
      color: #444;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dotted #ccc;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 3px;
      font-weight: bold;
      color: #1b5e20;
      font-size: 0.85rem;
    }
    input {
      width: 100%;
      padding: 8px;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #c62828, #2e7d32);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    #statusMessage {
      margin-top: 8px;
      font-weight: bold;
      text-align: center;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎄 猫寝うにのあわてんぼうクリスマス 🎁</h1>

  <div class="description">
    <h2>【イベント開催概要】</h2>
    <ul class="info-list">
      <li><span>開催日：</span>11/22</li>
      <li><span>時間：</span>14:00〜19:00（予定）</li>
      <li><span>場所：</span>都内某所 <span class="badge">レンタルスペースでまったり！</span></li>
      <li><span>金額：</span>5,000円以内（参加費＋食費込み）</li>
      <li><span>内容：</span>ご飯やお菓子も持ち込み！事前買い出し班あり♪</li>
    </ul>
    <p class="note">
      ※予約人数の確定を進める段階のため詳細は順次案内します！
    </p>
  </div>

  <form id="applyForm">
    <div class="form-group">
      <label for="name">ハンドルネーム</label>
      <input type="text" id="name" name="name" required placeholder="例：ねこうに太郎">
    </div>
    
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required placeholder="例：example@example.com">
    </div>
