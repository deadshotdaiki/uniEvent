<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫寝うにのあわんてんぼうクリスマス</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      background-image: linear-gradient(rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.05)), url('./bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    /* 雪のエフェクト */
    .snowflake {
      position: absolute;
      top: -10px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: fall linear infinite;
      box-shadow: 0 0 8px #fff;
    }
    @keyframes fall {
      0% {
        transform: translateY(-10px) translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) translateX(15px);
        opacity: 0.3;
      }
    }
    /* 氷・ガラス風の最高級コンテナ */
    .container {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 24px;
      max-width: 400px;
      width: 100%;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25), inset 0 0 25px rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 10;
    }

      content: "❄️ Crystal X'mas Night ❄️";
      display: block;
      text-align: center;
      font-size: 0.65rem;
      font-weight: bold;
      color: #fff;

      padding: 3px 12px;
      border-radius: 20px;
      width: fit-content;
      margin: 0 auto 10px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      letter-spacing: 0.1em;
    }
