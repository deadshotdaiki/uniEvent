    body {

      background-attachment: fixed;
      min-height: 100vh;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .snowflake {
      position: absolute;
      top: -10px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% {
        transform: translateY(-10px) translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) translateX(15px);
        opacity: 0.3;
      }
    }
    .container {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(5px);

      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      position: relative;
      z-index: 10;
    }

      color: #c62828;
      text-align: center;

    }

      font-size: 0.85rem;

    }

    }

      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
