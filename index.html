<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫寝うにのあわんてんぼうクリスマス</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)), url('./bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      overflow-y: auto;
    }
    /* 雪のエフェクト */
    .snowflake {
      position: absolute;
      top: -10px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: fall linear infinite;
      box-shadow: 0 0 6px #fff;
    }
    @keyframes fall {
      0% {
        transform: translateY(-10px) translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) translateX(20px);
        opacity: 0.3;
      }
    }
    /* 氷・ガラス風の最高級コンテナ */
    .container {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      padding: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.5);
      position: relative;
      z-index: 10;
      margin: auto;
    }
    /* キラリと光るリボン風バッジ */
    .container::before {
      content: "✨ SPECIAL XMAS ✨";
      display: block;
      text-align: center;
      font-size: 0.65rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff4081, #d32f2f);
      padding: 3px 10px;
      border-radius: 20px;
      width: fit-content;
      margin: 0 auto 10px auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      letter-spacing: 0.1em;
    }
    h1 {
      color: #b71c1c;
      text-align: center;
      font-size: 0.98rem;
      margin-bottom: 12px;

      font-weight: 900;
      white-space: nowrap;
    }
