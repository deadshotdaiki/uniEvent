<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫寝うにのあわてんぼうクリスマスイベント</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)), url('./bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }
    /* 雪降るギミック用スタイル */
    .snowflake {
      position: absolute;
      top: -10px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% {
        transform: translateY(-10px) translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) translateX(20px);
        opacity: 0.2;
      }
    }

    .container {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 3px solid #d4af37;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      position: relative;
      z-index: 10;
    }
    h1 {
      color: #d32f2f;
      text-align: center;
      font-size: 1.25rem;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(255,255,255,0.9), 0 0 10px #ffd700;
      border-bottom: 2px dashed #d4af37;
      padding-bottom: 6px;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    .description {
      background: rgba(255, 255, 255, 0.7);
      border-left: 4px solid #d32f2f;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .description h2 {
      font-size: 0.9rem;
      color: #2e7d32;
      margin-bottom: 4px;
    }
    .info-list {
      list-style: none;
      line-height: 1.5;
      font-size: 0.8rem;
    }
    .info-list li span {
      font-weight: bold;
      color: #c62828;
    }
    .badge {
      display: inline-block;
      background: #2e7d32;
      color: #fff;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .note {
      font-size: 0.72rem;
      color: #333;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dotted #ccc;
    }
    .form-group {
      margin-bottom: 8px;
    }
    label {
      display: block;
      margin-bottom: 2px;
      font-weight: bold;
      color: #2e7d32;
      font-size: 0.8rem;
    }
    input {
      width: 100%;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #b71c1c;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #d32f2f, #2e7d32);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
